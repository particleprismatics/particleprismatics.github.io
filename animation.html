<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Prismatics — Animation Studio</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{ background:#0a0a0c; overflow:hidden; font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  #stage{ position:fixed; inset:0; }
  .back{ position:fixed; top:16px; left:18px; z-index:20; color:rgba(255,255,255,.5); font-size:11px; letter-spacing:.14em; text-transform:uppercase; text-decoration:none; }
  .back:hover{ color:#fff; }
  #panel{ position:fixed; top:16px; right:16px; z-index:10; width:236px; background:rgba(12,12,18,.72);
    border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:14px 16px 16px; color:rgba(255,255,255,.62);
    font-size:11px; line-height:1.5; backdrop-filter:blur(10px); user-select:none; transition:opacity .35s, transform .35s; }
  #panel.hidden{ opacity:0; transform:translateX(20px); pointer-events:none; }
  #panel h3{ font-size:10px; letter-spacing:1.4px; text-transform:uppercase; color:rgba(255,255,255,.4); margin:12px 0 6px; }
  #panel h3:first-child{ margin-top:0; }
  #panel label{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:5px 0; }
  #panel input[type=range]{ width:96px; accent-color:#9db4ff; }
  #panel select{ background:#14141c; color:#cfe6ff; border:1px solid rgba(255,255,255,.12); border-radius:5px; font:inherit; padding:2px 4px; }
  #panel .val{ width:44px; text-align:right; color:#9db4ff; font-variant-numeric:tabular-nums; }
  #panel .chk{ justify-content:flex-start; gap:8px; cursor:pointer; }
  #panel .row-btns{ display:flex; gap:8px; margin-top:14px; }
  #panel button{ flex:1; cursor:pointer; font:inherit; color:#dff0ff; background:rgba(157,180,255,.16);
    border:1px solid rgba(157,180,255,.4); border-radius:6px; padding:7px 0; }
  #panel button:hover{ background:rgba(157,180,255,.28); }
  #hint{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:10; color:rgba(255,255,255,.28); font-size:11px; letter-spacing:.5px; transition:opacity .5s; }
</style>
</head>
<body>
<div id="stage"></div>
<a class="back" href="index.html">← Home</a>
<div id="hint">press <b style="color:rgba(255,255,255,.5)">H</b> to hide panel · <b style="color:rgba(255,255,255,.5)">R</b> to replay</div>

<div id="panel">
  <h3>Timing</h3>
  <label>Hold (start)<input type="range" id="s-holdStart" min="0" max="4000" step="100" value="0"><span class="val" id="v-holdStart"></span></label>
  <label>Form time<input type="range" id="s-formDur" min="400" max="5000" step="100" value="2200"><span class="val" id="v-formDur"></span></label>
  <label>Stagger<input type="range" id="s-stagger" min="0" max="3000" step="50" value="1100"><span class="val" id="v-stagger"></span></label>
  <label>Easing<select id="s-ease">
    <option value="easeInOut">ease in-out</option><option value="easeOut">ease out</option>
    <option value="easeOutBack">ease out-back</option><option value="linear">linear</option></select></label>
  <label>Stagger dir<select id="s-dir">
    <option value="lr">left → right</option><option value="center">center → out</option><option value="random">random</option></select></label>
  <label>Hold (formed)<input type="range" id="s-holdFormed" min="0" max="6000" step="100" value="0"><span class="val" id="v-holdFormed"></span></label>
  <label>Crossfade<input type="range" id="s-xfade" min="0" max="5000" step="100" value="2200"><span class="val" id="v-xfade"></span></label>
  <h3>Look</h3>
  <label>Point size<input type="range" id="s-size" min="8" max="55" step="1" value="35"><span class="val" id="v-size"></span></label>
  <label>Density<input type="range" id="s-samp" min="2" max="8" step="1" value="2"><span class="val" id="v-samp"></span></label>
  <label>Spectrum sat<input type="range" id="s-sat" min="0" max="100" step="5" value="100"><span class="val" id="v-sat"></span></label>
  <label>White mix<input type="range" id="s-white" min="0" max="80" step="5" value="0"><span class="val" id="v-white"></span></label>
  <label class="chk"><input id="s-mouse" type="checkbox" checked> mouse repel when formed</label>
  <label class="chk"><input id="s-loop" type="checkbox"> loop</label>
  <div class="row-btns">
    <button id="btn-replay">Replay</button>
    <button id="btn-logo">Show logo</button>
  </div>
</div>

<script src="assets/particle-anim.js"></script>
<script>
  const anim = initParticleIntro({
    mount: document.getElementById('stage'),
    logoSrc: 'assets/logo.png',
    controls: true, autoplay: true, loop: false, mouseRepel: true,
  });

  const ms = v => (v>=1000 ? (v/1000).toFixed(1)+'s' : v+'ms');
  function wire(id, valId, key, scale, fmt){
    const sl=document.getElementById(id), vl=document.getElementById(valId);
    const upd=()=>{ const v=Number(sl.value)*scale; if(vl) vl.textContent=fmt?fmt(v):sl.value; anim.setParam(key, v); };
    sl.addEventListener('input', upd);
    if(vl) vl.textContent = fmt?fmt(Number(sl.value)*scale):sl.value;
  }
  wire('s-holdStart','v-holdStart','holdStart',1,ms);
  wire('s-formDur','v-formDur','formDur',1,ms);
  wire('s-stagger','v-stagger','stagger',1,ms);
  wire('s-holdFormed','v-holdFormed','holdFormed',1,ms);
  wire('s-xfade','v-xfade','xfade',1,ms);
  wire('s-size','v-size','pointSize',1,v=>v.toFixed(0));
  wire('s-samp','v-samp','sampling',1,v=>v.toFixed(0));
  wire('s-sat','v-sat','sat',0.01,v=>Math.round(v*100));
  wire('s-white','v-white','whiteMix',0.01,v=>Math.round(v*100)+'%');
  document.getElementById('s-ease').addEventListener('change',e=>anim.setParam('ease',e.target.value));
  document.getElementById('s-dir').addEventListener('change',e=>anim.setParam('dir',e.target.value));
  document.getElementById('s-mouse').addEventListener('change',e=>anim.setParam('mouseRepel',e.target.checked));
  document.getElementById('s-loop').addEventListener('change',e=>anim.setParam('loop',e.target.checked));
  document.getElementById('btn-replay').addEventListener('click',()=>anim.play());
  document.getElementById('btn-logo').addEventListener('click',()=>anim.showLogo());
  window.addEventListener('keydown',e=>{
    if(e.key==='h'||e.key==='H') document.getElementById('panel').classList.toggle('hidden');
    if(e.key==='r'||e.key==='R') anim.play();
  });
  setTimeout(()=>{ const h=document.getElementById('hint'); if(h) h.style.opacity=0; }, 6000);
</script>
</body>
</html>
